name: Check browser demo rules
on:
  push:
    paths:
      - "docs/logic.mjs"
      - "docs/index.html"
      - "scripts/test-demo.mjs"
      - ".github/workflows/check-demo.yml"
  pull_request:
    paths:
      - "docs/logic.mjs"
      - "docs/index.html"
      - "scripts/test-demo.mjs"
      - ".github/workflows/check-demo.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test all 9 RPS combinations, attack transfer and best-of-three
        run: node --test scripts/test-demo.mjs
